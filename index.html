<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宸宸日语 · 老朱的日语训练营</title>
<style>
:root{
  --green:#58cc02; --green-dark:#46a302; --blue:#1cb0f6; --blue-dark:#1899d6;
  --red:#ff4b4b; --yellow:#ffc800; --purple:#ce82ff;
  --bg:#f7f7f7; --card:#fff; --text:#4b4b4b; --sub:#777; --line:#e5e5e5;
  --gold:#ffc800;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.logo .tiger{font-size:22px}
.xp{background:#fff3cd;border-radius:16px;padding:4px 12px;font-size:13px;font-weight:700;color:#8a6d00}
.streak{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:#ff9600}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:50}
nav button{flex:1;background:none;border:none;padding:10px 0 8px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button.active{color:var(--green-dark)}
nav button .icon{font-size:22px}

main{max-width:720px;margin:0 auto;padding:16px}
.screen{display:none}
.screen.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h2.section{font-size:20px;font-weight:800;margin:8px 0 4px}
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}

/* 卡片 */
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:14px}
.btn{display:inline-block;background:var(--green);color:#fff;border:none;border-radius:14px;padding:14px 24px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--green-dark);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-dark)}
.btn:disabled{opacity:.5;box-shadow:0 4px 0 #999;background:#999}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-dark)}
.btn.red{background:var(--red);box-shadow:0 4px 0 #d33131}
.btn.white{background:#fff;color:var(--blue);border:2px solid var(--blue);box-shadow:0 3px 0 var(--blue);}
.btn.block{display:block;width:100%;text-align:center}
.btn.small{padding:8px 16px;font-size:13px;border-radius:10px}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}

/* 闪卡 */
.flash-card{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;position:relative;transition:transform .1s}
.flash-card:active{transform:scale(.98)}
.jp-big{font-size:52px;font-weight:700;color:#1f1f1f;letter-spacing:2px}
.romaji{font-size:18px;color:var(--blue);font-weight:600;margin-top:6px}
.cn-meaning{font-size:26px;font-weight:700;margin-top:12px}
.memo{font-size:13px;color:var(--sub);margin-top:10px;background:#f5f5f5;padding:6px 12px;border-radius:8px}
.speak-btn{background:none;border:2px solid var(--blue);border-radius:50%;width:56px;height:56px;font-size:24px;color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:16px;transition:background .15s}
.speak-btn:active{background:var(--blue);color:#fff}
.speak-btn.big{width:72px;height:72px;font-size:30px}
.known-row{display:flex;gap:10px;margin-top:16px;width:100%}
.known-row .btn{flex:1;font-size:14px;padding:12px}

/* 练习 */
.quiz-prompt{font-size:15px;color:var(--sub);text-align:center;margin-bottom:10px}
.quiz-target{text-align:center;font-size:44px;font-weight:700;margin:8px 0 16px}
.quiz-target .romaji{font-size:16px}
.audio-hint{display:inline-flex;align-items:center;gap:6px;background:#e8f6ff;color:var(--blue-dark);border-radius:12px;padding:10px 18px;font-size:15px;font-weight:700;cursor:pointer;border:2px solid var(--blue)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 10px;font-size:17px;font-weight:600;cursor:pointer;text-align:center;transition:all .12s;min-height:56px;display:flex;align-items:center;justify-content:center}
.opt:active{transform:scale(.97)}
.opt.correct{background:#d7ffb8;border-color:var(--green);color:var(--green-dark)}
.opt.wrong{background:#ffdfe0;border-color:var(--red);color:#d33131}
.opt.disabled{pointer-events:none}
.match-target{font-size:32px;font-weight:700;text-align:center;margin:10px 0}

/* 五十音 */
.kana-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.kana-cell{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;transition:background .12s;box-shadow:0 2px 4px rgba(0,0,0,.04)}
.kana-cell:active{background:#d7ffb8}
.kana-cell .k{font-size:22px;font-weight:700}
.kana-cell .r{font-size:10px;color:var(--sub);margin-top:2px}
.kana-row-label{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--sub);margin-top:8px;text-align:left}

/* 五十音切换 tab */
.kana-tabs{display:flex;gap:8px;margin-bottom:8px}
.kana-tab{flex:1;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer}
.kana-tab.active{border-color:var(--green);background:#d7ffb8;color:var(--green-dark)}

/* 词库分类维度 */
.dim-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.dim-tab{flex:1;min-width:62px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:7px 4px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer}
.dim-tab.active{border-color:var(--green);background:#d7ffb8;color:var(--green-dark)}
.wg{margin-bottom:8px}
.wg-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#f0f0f0;border-radius:10px;cursor:pointer;font-weight:800;font-size:14px}
.wg-count{font-size:12px;color:var(--sub);font-weight:600;margin-left:auto}
.wg-body{padding:0 4px}

/* 进度 */
.stat-row{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border-radius:14px;padding:14px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.stat .num{font-size:26px;font-weight:800;color:var(--green-dark)}
.stat .lbl{font-size:12px;color:var(--sub);margin-top:2px}
.word-list{max-height:none}
.word-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.word-item:last-child{border-bottom:none}
.word-item .jp{font-size:17px;font-weight:700;min-width:110px}
.word-item .cn{font-size:14px;color:var(--sub);flex:1}
.master-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-new{background:#ccc}.dot-learning{background:var(--yellow)}.dot-mastered{background:var(--green)}

.progress-bar{height:12px;background:#e5e5e5;border-radius:8px;overflow:hidden;margin:8px 0}
.progress-bar .fill{height:100%;background:var(--green);border-radius:8px;transition:width .4s}

/* 结果页 */
.result-icon{font-size:64px;text-align:center;margin:20px 0}
.result-title{text-align:center;font-size:24px;font-weight:800;margin-bottom:6px}
.result-sub{text-align:center;color:var(--sub);margin-bottom:20px}
.correct-count{display:flex;justify-content:center;gap:24px;margin:16px 0}
.cc-item{text-align:center}
.cc-item .n{font-size:32px;font-weight:800}
.cc-item .l{font-size:12px;color:var(--sub)}
.good{color:var(--green-dark)}.bad{color:var(--red)}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:#333;color:#fff;padding:10px 20px;border-radius:12px;font-size:14px;z-index:99;transition:transform .3s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* 练习中心 */
.practice-group{margin-bottom:18px}
.pg-title{font-size:16px;font-weight:800}
.pg-sub{font-size:12px;color:var(--sub);margin-bottom:10px}
.practice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.practice-item{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;transition:all .12s}
.practice-item:active{transform:scale(.97);background:#f0f0f0}
.pi-icon{font-size:26px}
.pi-name{font-size:14px;font-weight:700;margin-top:4px}
.pi-desc{font-size:11px;color:var(--sub);margin-top:2px}

/* 配对练习 */
.match-cols{display:flex;gap:12px;margin-top:12px}
.match-col{flex:1;display:flex;flex-direction:column;gap:10px}
.match-item{border:2px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;font-size:17px;font-weight:700;cursor:pointer;transition:all .12s;background:var(--card)}
.match-item:active{transform:scale(.97)}
.match-item.sel{border-color:var(--blue);background:#e8f6ff;color:var(--blue-dark)}
.match-item.ok{border-color:var(--green);background:#d7ffb8;color:var(--green-dark);pointer-events:none}
.match-item.no{border-color:var(--red);background:#ffdfe0;color:#d33131}
.match-item.jp{font-size:18px}
.match-item.cn{font-size:15px;color:var(--text)}

.hidden{display:none!important}
footer{text-align:center;color:#bbb;font-size:12px;padding:16px}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="tiger">🐯</span>宸宸日语</div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="streak">🔥<span id="streakNum">0</span></div>
    <div class="xp">⭐ <span id="xpNum">0</span> XP</div>
  </div>
</header>

<main>
  <!-- 首页/学习 -->
  <section id="screen-learn" class="screen active">
    <div id="todayInfo"></div>
    <h2 class="section">自由练习</h2>
    <div class="sub">不限课程，从全部词库抽词巩固</div>
    <div class="btn-row">
      <button class="btn blue" onclick="showPractice()">🎯 练习中心</button>
      <button class="btn blue" onclick="startFlash()">🃏 闪卡速记</button>
    </div>
    <div class="btn-row">
      <button class="btn white" onclick="startQuiz('listen')">👂 听力选词</button>
      <button class="btn white" onclick="showWordList()">📖 全部词库</button>
    </div>
  </section>

  <!-- 练习页 -->
  <section id="screen-quiz" class="screen">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <span style="font-size:14px;color:var(--sub)" id="quizProgress"></span>
      <span style="font-size:14px;font-weight:800;color:var(--yellow)" id="quizStreak">🔥 0</span>
    </div>
    <div class="progress-bar"><div class="fill" id="quizBar" style="width:0%"></div></div>
    <div class="card" style="margin-top:10px">
      <div id="quizArea"></div>
    </div>
  </section>

  <!-- 结果页 -->
  <section id="screen-result" class="screen">
    <div class="card" style="margin-top:40px">
      <div class="result-icon" id="resIcon">🎉</div>
      <div class="result-title" id="resTitle">太棒了！</div>
      <div class="result-sub" id="resSub"></div>
      <div class="correct-count" id="resCount"></div>
      <button class="btn blue block" onclick="showScreen('learn')">返回首页</button>
      <button class="btn white block" style="margin-top:10px" onclick="retryWrong()">🔁 重做错题</button>
    </div>
  </section>

  <!-- 词库页 -->
  <section id="screen-words" class="screen">
    <h2 class="section">全部词库</h2>
    <div class="dim-tabs">
      <button class="dim-tab active" id="dimTabCat" onclick="setWordDim('cat')">📂 主题</button>
      <button class="dim-tab" id="dimTabPos" onclick="setWordDim('pos')">🏷️ 词性</button>
      <button class="dim-tab" id="dimTabScript" onclick="setWordDim('script')">🔤 假名</button>
      <button class="dim-tab" id="dimTabSource" onclick="setWordDim('source')">📌 来源</button>
      <button class="dim-tab" id="dimTabMastery" onclick="setWordDim('mastery')">🎯 掌握度</button>
    </div>
    <div class="sub" id="wordCount"></div>
    <div class="card" style="padding:8px 12px">
      <div class="word-list" id="wordList"></div>
    </div>
  </section>

  <!-- 课程页 -->
  <section id="screen-courses" class="screen">
    <h2 class="section">📚 课程</h2>
    <div class="sub">每天一课 · 独立可选 · 每晚 20:00 新课自动同步 · 点开任意一天复习</div>
    <div id="courseList"></div>
    <div id="courseDetail" class="hidden"></div>
  </section>

  <!-- 练习中心 -->
  <section id="screen-practice" class="screen">
    <h2 class="section">🎯 练习中心</h2>
    <div class="sub">选一种模式开练 · 单词练习</div>
    <div id="practiceList"></div>
  </section>

  <!-- 五十音 -->
  <section id="screen-kana" class="screen">
    <h2 class="section">あ 五十音</h2>
    <div class="sub">完整五十音表 · 点卡片听发音</div>
    <div class="card" style="padding:12px">
      <div class="kana-tabs">
        <button class="kana-tab active" id="tabHira" onclick="setKanaTab('hira')">平假名 あ</button>
        <button class="kana-tab" id="tabKata" onclick="setKanaTab('kata')">片假名 ア</button>
      </div>
      <div id="kanaTable"></div>
    </div>
    <h2 class="section">五十音训练</h2>
    <div class="sub">只练五十音 · 跟随上方 tab 切换平假名/片假名</div>
    <div class="card" style="padding:16px">
      <div id="kanaPractice"></div>
    </div>
  </section>
</main>

<nav>
  <button class="active" onclick="showScreen('learn')"><span class="icon">🏠</span>学习</button>
  <button onclick="showCourses()"><span class="icon">📚</span>课程</button>
  <button onclick="showPractice()"><span class="icon">🎯</span>练习</button>
  <button onclick="showKana()"><span class="icon">あ</span>五十音</button>
  <button onclick="showWordList()"><span class="icon">📖</span>词库</button>
  <button onclick="showProgress()"><span class="icon">📊</span>进度</button>
</nav>

<div class="toast" id="toast"></div>

<script>

const WORDS = [

/* ============ 状态 ============ */
const LS_KEY = 'cc-jp-state-v1';
let state = loadState();

function loadState(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(s) return s; }catch(e){}
  return {xp:0, streak:0, lastDay:'', mastery:{}, wrongs:{}, totalAnswered:0, correctAnswered:0};
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function todayPadded(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }

function ensureStreak(){
  const t = todayStr();
  if(state.lastDay !== t){
    const y = new Date(); y.setDate(y.getDate()-1);
    const ystr = y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    if(state.lastDay === ystr){ state.streak += 1; }
    else { state.streak = 1; }
    state.lastDay = t;
    saveState();
  }
  document.getElementById('streakNum').textContent = state.streak;
  document.getElementById('xpNum').textContent = state.xp;
}

let jpVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  jpVoice = vs.find(v=>v.lang==='ja-JP') || null;
}
speechSynthesis.onvoiceschanged = pickVoice;

function speak(text, rate=0.85){
  if(!text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  if(jpVoice) u.voice = jpVoice;
  u.rate = rate;
  speechSynthesis.speak(u);
}

function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function sample(arr,n){ return shuffle(arr).slice(0,n); }
function masteryOf(jp){
  const m = state.mastery[jp]||0;
  return m>=5?'mastered':(m>=1?'learning':'new');
}
function pickLearningWords(n){
  // 优先未掌握的 + 错的
  const newWords = WORDS.filter(w=>masteryOf(w.jp)==='new');
  const weak = Object.keys(state.wrongs).map(jp=>WORDS.find(w=>w.jp===jp)).filter(Boolean);
  const rest = WORDS.filter(w=>masteryOf(w.jp)!=='new' && !weak.includes(w));
  let pool = shuffle([...weak, ...newWords, ...rest]);
  if(pool.length>n) pool = pool.slice(0,n);
  return pool;
}
function lessonWords(L){
  return (L.words||[]).map(([jp,rom,cn])=>{
    return WORDS.find(x=>x.jp===jp) || {cn, jp, rom, memo:'', cat:'本课'};

}

let flashWords=[], flashIdx=0, flashFlipped=false, flashDone=0;
function startFlash(lessonId){
  let words = lessonId ? lessonWords(LESSONS.find(L=>L.id===lessonId)) : pickLearningWords(10);

}
function renderFlash(){
  if(flashIdx >= flashWords.length){
    const correct = Math.round(flashDone/flashWords.length*100);
    state.xp += 10; saveState(); ensureStreak();
    showResult(correct>=80?'great':'ok', flashDone, flashWords.length-flashDone);
    return;
  }
  const w = flashWords[flashIdx];
  $('quizProgress').textContent = `闪卡 ${flashIdx+1}/${flashWords.length}`;
  $('quizStreak').textContent = `🔥 ${flashDone}`;
  $('quizBar').style.width = (flashIdx/flashWords.length*100)+'%';
  flashFlipped = false;
  $('quizArea').innerHTML = `
    <div class="flash-card" id="flashCard" onclick="flipFlash()">
      <div class="jp-big">${w.jp}</div>
      <div class="romaji">${w.rom}</div>
      <div class="cn-meaning hidden" id="flashCn">${w.cn}</div>
      <div class="memo hidden" id="flashMemo">💡 ${w.memo}</div>

      <button class="btn" onclick="flashAnswer(true)">✅ 认识</button>
    </div>`;
}
function flipFlash(){
  flashFlipped = !flashFlipped;
  $('flashCn').classList.toggle('hidden', !flashFlipped);
  $('flashMemo').classList.toggle('hidden', !flashFlipped);
}
function flashAnswer(known){
  const w = flashWords[flashIdx];
  if(known){
    state.mastery[w.jp] = (state.mastery[w.jp]||0) + 1;
    flashDone++;
  } else {
    state.mastery[w.jp] = Math.max(0, (state.mastery[w.jp]||0) - 1);
    state.wrongs[w.jp] = (state.wrongs[w.jp]||0) + 1;
  }
  saveState();
  flashIdx++;
  renderFlash();
}

/* ============ 练习 ============ */
let quizQuestions=[], quizIdx=0, quizCorrect=0, quizStreak=0, quizWrongList=[], quizMode='mixed', quizTotal=0;
function startQuiz(mode, lessonId, script){
  quizMode = mode||'mixed';
  if(quizMode==='kana2rom'||quizMode==='rom2kana'||quizMode==='kanaListen'||quizMode==='kanaMixed'){ startKanaQuiz(quizMode, script); return; }
  if(quizMode==='match'){ startMatchQuiz(lessonId); return; }
  const L = lessonId ? LESSONS.find(x=>x.id===lessonId) : null;
  let words = L ? lessonWords(L) : pickLearningWords(12);
  if(!words.length){ toast('本课还没有单词'); return; }
  const distPool = L ? WORDS : words;
  quizQuestions = words.map(w=>makeQuestion(w, words, distPool));
  quizIdx = 0; quizCorrect = 0; quizStreak = 0; quizWrongList = [];
  quizTotal = quizQuestions.length;
  showScreen('quiz');
  renderQuiz();
}
function makeQuestion(w, pool, distPool){
  const type = quizMode==='listen' ? 'listen' : (quizMode==='mixed' ? ['cn2jp','jp2cn','listen'][Math.floor(Math.random()*3)] : quizMode);
  // 干扰项：同主题优先，其次随机（本课练习从全部词库抽干扰项，保证选项不重复）
  const dp = distPool || pool;
  const sameCat = dp.filter(x=>x.cat===w.cat && x.jp!==w.jp);
  let distractors = sample(sameCat, 2);
  const fill = dp.filter(x=>!sameCat.includes(x) && x.jp!==w.jp);
  while(distractors.length<3 && fill.length){ distractors.push(fill.shift()); }
  const opts = shuffle([w, ...distractors.slice(0,3)]);
  return {w, type, opts};
}
function makeKanaQuestion(w, pool, type){
  const opts = shuffle([w, ...sample(pool.filter(x=>x.k!==w.k), 3)]);
  return {w, type, opts};
}
function startKanaQuiz(type, script){
  const pool = script==='kata' ? KANA_ALL_KATA : KANA_ALL;
  const words = sample(pool, 10);
  quizQuestions = words.map(w=>makeKanaQuestion(w, pool, type==='kanaMixed' ? ['kana2rom','rom2kana','kanaListen'][Math.floor(Math.random()*3)] : type));
  quizIdx = 0; quizCorrect = 0; quizStreak = 0; quizWrongList = [];
  quizTotal = quizQuestions.length;
  showScreen('quiz');
  renderQuiz();
}

/* ============ 配对练习 ============ */
let matchPairs=[], matchLeft=[], matchRight=[], matchSelL=null, matchSelR=null, matchDone=0, matchMode='word';
function startMatchQuiz(lessonId, script){
  if(script){
    // 五十音配对：假名 ↔ 罗马音
    matchMode = 'kana'; quizMode = 'kanaMatch';
    const pool = script==='kata' ? KANA_ALL_KATA : KANA_ALL;
    matchPairs = sample(pool, 6).map(w=>({jp:w.k, cn:w.r}));
    matchLeft = shuffle(matchPairs.map(p=>p.jp));
    matchRight = shuffle(matchPairs.map(p=>p.cn));
    matchSelL = null; matchSelR = null; matchDone = 0;
    quizCorrect = 0; quizWrongList = [];
    quizTotal = matchPairs.length;
    showScreen('quiz');
    renderMatch();
    return;
  }
  matchMode = 'word';
  const L = lessonId ? LESSONS.find(x=>x.id===lessonId) : null;
  let pool = L ? lessonWords(L) : pickLearningWords(8);
  if(pool.length<6 && !L) pool = [...pool, ...sample(WORDS.filter(w=>!pool.includes(w)), 6-pool.length)];
  matchPairs = sample(pool, Math.min(6, pool.length));
  matchLeft = shuffle(matchPairs.map(w=>w.jp));
  matchRight = shuffle(matchPairs.map(w=>w.cn));
  matchSelL = null; matchSelR = null; matchDone = 0;
  quizCorrect = 0; quizWrongList = [];
  quizTotal = matchPairs.length;
  showScreen('quiz');
  renderMatch();
}
function renderMatch(){
  $('quizProgress').textContent = `配对 ${matchDone}/${matchPairs.length} 对`;
  $('quizStreak').textContent = `🔥 ${matchDone}`;
  $('quizBar').style.width = (matchDone/matchPairs.length*100)+'%';
  let l='', r='';
  matchLeft.forEach((jp,i)=>{ l += `<div class="match-item jp ${matchSelL===i?'sel':''}" id="mL${i}" onclick="matchClick('L',${i})">${jp}</div>`; });
  matchRight.forEach((cn,i)=>{ r += `<div class="match-item cn ${matchSelR===i?'sel':''}" id="mR${i}" onclick="matchClick('R',${i})">${cn}</div>`; });
  $('quizArea').innerHTML = `<div class="quiz-prompt">${matchMode==='kana' ? '先点一边，再点另一边配对（假名 ↔ 罗马音）' : '先点一边，再点另一边配对（日语 ↔ 中文）'}</div>
    <div class="match-cols"><div class="match-col">${l}</div><div class="match-col">${r}</div></div>
    <div id="quizFeedback" style="text-align:center;margin-top:14px;min-height:24px"></div>`;
}
function matchClick(side, i){
  if(side==='L'){
    if(matchSelL===i){ matchSelL=null; renderMatch(); return; }
    matchSelL = i;
  } else {
    if(matchSelR===i){ matchSelR=null; renderMatch(); return; }
    matchSelR = i;
  }
  if(matchSelL!==null && matchSelR!==null){
    const jp = matchLeft[matchSelL], cn = matchRight[matchSelR];
    const pair = matchPairs.find(p=>p.jp===jp);
    if(pair && pair.cn===cn){
      $('mL'+matchSelL).classList.add('ok');
      $('mR'+matchSelR).classList.add('ok');
      matchDone++; quizCorrect++;
      $('quizFeedback').innerHTML = `<span style="color:var(--green-dark);font-weight:800">✅ ${jp} = ${cn}</span>`;
      matchSelL=null; matchSelR=null;
      setTimeout(()=>{ if(matchDone>=matchPairs.length){ finishMatch(); } else { renderMatch(); } }, 450);
    } else {
      $('mL'+matchSelL).classList.add('no');
      $('mR'+matchSelR).classList.add('no');
      $('quizFeedback').innerHTML = `<span style="color:var(--red);font-weight:800">❌ ${jp} ≠ ${cn}</span>`;
      const l=matchSelL, r=matchSelR;
      setTimeout(()=>{
        $('mL'+l).classList.remove('no');
        $('mR'+r).classList.remove('no');
        matchSelL=null; matchSelR=null;
        renderMatch();
      }, 600);
    }
  } else {
    renderMatch();
  }
}
function finishMatch(){
  state.xp += quizCorrect*2; saveState(); ensureStreak();
  const pct = Math.round(quizCorrect/quizTotal*100);
  showResult(pct>=80?'great':(pct>=50?'ok':'keep'), quizCorrect, quizTotal-quizCorrect);
}

let kfWords=[], kfIdx=0, kfFlipped=false, kfKnown=0;
function startKanaFlash(script){
  quizMode = 'kanaFlash';
  const pool = script==='kata' ? KANA_ALL_KATA : KANA_ALL;
  kfWords = sample(pool, 12);

}
function renderKanaFlash(){
  if(kfIdx >= kfWords.length){
    state.xp += 10; saveState(); ensureStreak();
    showResult(kfKnown/kfWords.length>=0.8?'great':'ok', kfKnown, kfWords.length-kfKnown);
    return;
  }
  const w = kfWords[kfIdx];
  $('quizProgress').textContent = `五十音闪卡 ${kfIdx+1}/${kfWords.length}`;
  $('quizStreak').textContent = `🔥 ${kfKnown}`;
  $('quizBar').style.width = (kfIdx/kfWords.length*100)+'%';
  kfFlipped = false;
  $('quizArea').innerHTML = `
    <div class="flash-card" id="flashCard" onclick="flipKanaFlash()">
      <div class="jp-big">${w.k}</div>
      <div class="romaji hidden" id="kfR">${w.r}</div>
      <div style="font-size:12px;color:#bbb;margin-top:12px">👆 点卡片看读音</div>
    </div>
    <div style="display:flex;justify-content:center">
      <button class="speak-btn" onclick="event.stopPropagation();speak('${w.k}')">🔊</button>
    </div>
    <div class="known-row">

      <button class="btn" onclick="kanaFlashAnswer(true)">✅ 认识</button>
    </div>`;
  // 闪卡点开后自动发音
  speak(w.k);
}
function flipKanaFlash(){
  kfFlipped = !kfFlipped;
  $('kfR').classList.toggle('hidden', !kfFlipped);
  // 翻卡看读音时再读一遍
  if(kfFlipped) speak(kfWords[kfIdx].k);
}
function kanaFlashAnswer(known){
  if(known) kfKnown++;
  kfIdx++;
  renderKanaFlash();
}
function renderQuiz(){
  if(quizIdx >= quizQuestions.length){
    state.xp += quizCorrect*2; saveState(); ensureStreak();
    const pct = Math.round(quizCorrect/quizTotal*100);
    showResult(pct>=80?'great':(pct>=50?'ok':'keep'), quizCorrect, quizTotal-quizCorrect);
    return;
  }
  const q = quizQuestions[quizIdx];
  const typeLabel = {cn2jp:'看中文选日语',jp2cn:'看日语选中文',listen:'听音选词',kana2rom:'看假名选读音',rom2kana:'看读音选假名',kanaListen:'听音选假名'}[q.type]||'综合';
  $('quizProgress').textContent = `第 ${quizIdx+1}/${quizTotal} 题 · ${typeLabel}`;
  $('quizStreak').textContent = `🔥 ${quizStreak}`;
  $('quizBar').style.width = (quizIdx/quizTotal*100)+'%';

  let html = '';
  let optText = o=>o.cn;
  if(q.type==='jp2cn'){
    html = `<div class="quiz-prompt">选出正确的中文意思</div>
      <div class="quiz-target">${q.w.jp}<div class="romaji">${q.w.rom}</div></div>
      <div style="text-align:center;margin-top:6px"><button class="speak-btn" style="width:44px;height:44px;font-size:18px" onclick="speak('${q.w.jp}')">🔊</button></div>`;
    optText = o=>o.cn;
  } else if(q.type==='cn2jp'){
    html = `<div class="quiz-prompt">选出对应的日语</div>
      <div class="quiz-target" style="font-size:30px">${q.w.cn}</div>
      <div style="text-align:center;margin-top:6px"><button class="speak-btn" style="width:44px;height:44px;font-size:18px" onclick="speak('${q.w.jp}')">🔊</button></div>`;
    optText = o=>o.jp;
  } else if(q.type==='listen'){
    html = `<div class="quiz-prompt">听发音，选出对应的词</div>
      <div style="text-align:center;margin:10px 0">
        <button class="audio-hint" onclick="speak('${q.w.jp}')">🔊 再听一遍</button>
      </div>`;
    optText = o=>o.cn;
  } else if(q.type==='kana2rom'){
    html = `<div class="quiz-prompt">这个假名怎么读？</div>
      <div class="quiz-target">${q.w.k}</div>
      <div style="text-align:center;margin-top:6px"><button class="speak-btn" style="width:44px;height:44px;font-size:18px" onclick="speak('${q.w.k}')">🔊</button></div>`;
    optText = o=>o.r;
  } else if(q.type==='rom2kana'){
    html = `<div class="quiz-prompt">选出对应的假名</div>
      <div class="quiz-target">${q.w.r}</div>
      <div style="text-align:center;margin-top:6px"><button class="speak-btn" style="width:44px;height:44px;font-size:18px" onclick="speak('${q.w.k}')">🔊</button></div>`;
    optText = o=>o.k;
  } else if(q.type==='kanaListen'){
    html = `<div class="quiz-prompt">听发音，选出假名</div>
      <div style="text-align:center;margin:10px 0">
        <button class="audio-hint" onclick="speak('${q.w.k}')">🔊 再听一遍</button>
      </div>`;
    optText = o=>o.k;
  }
  html += `<div class="options">`;
  q.opts.forEach((o,i)=>{
    html += `<div class="opt" id="opt${i}" onclick="answerQuiz(${i}, this)">${optText(o)}</div>`;
  });
  html += `</div><div id="quizFeedback" style="text-align:center;margin-top:14px;min-height:24px"></div>`;
  $('quizArea').innerHTML = html;
  // 题目点开后自动发音（如需要可手动点按钮重听）
  if(q.type==='jp2cn'||q.type==='cn2jp'||q.type==='listen'){ speak(q.w.jp); }
  else if(q.type==='kana2rom'||q.type==='rom2kana'||q.type==='kanaListen'){ speak(q.w.k); }
}
function answerQuiz(i, el){
  const q = quizQuestions[quizIdx];
  const correct = q.opts[i].jp === q.w.jp;
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
  q.opts.forEach((o,j)=>{
    const cell = $('opt'+j);
    if(o.jp===q.w.jp) cell.classList.add('correct');
    else if(j===i) cell.classList.add('wrong');
  });
  if(correct){
    quizCorrect++; quizStreak++;
    if(!q.type.startsWith('kana')) state.mastery[q.w.jp] = (state.mastery[q.w.jp]||0)+1;
    const fb = q.type.startsWith('kana') ? `✅ 正确！${q.w.k} = ${q.w.r}` : `✅ 正确！${q.w.cn} = ${q.w.jp}`;
    $('quizFeedback').innerHTML = `<span style="color:var(--green-dark);font-weight:800">${fb}</span>`;
  } else {
    quizStreak = 0;
    if(!q.type.startsWith('kana')){
      state.mastery[q.w.jp] = Math.max(0,(state.mastery[q.w.jp]||0)-1);
      state.wrongs[q.w.jp] = (state.wrongs[q.w.jp]||0)+1;
      if(!quizWrongList.includes(q.w)) quizWrongList.push(q.w);
    }
    const fb = q.type.startsWith('kana') ? `❌ ${q.w.k} = ${q.w.r}` : `❌ ${q.w.cn} = ${q.w.jp}（${q.w.rom}）`;
    $('quizFeedback').innerHTML = `<span style="color:var(--red);font-weight:800">${fb}</span>`;
  }
  state.totalAnswered++; if(correct) state.correctAnswered++; saveState();
  setTimeout(()=>{ quizIdx++; renderQuiz(); }, 1100);
}
function retryWrong(){
  if(quizWrongList.length===0){ toast('这次没有错题，太棒了！'); return; }
  if(quizMode.startsWith('kana')||quizMode==='match'){ toast('此模式暂不支持错题重练'); return; }
  quizQuestions = quizWrongList.map(w=>({w, type:'jp2cn', opts:shuffle([w,...sample(WORDS.filter(x=>x.jp!==w.jp),3)])}));
  quizIdx=0; quizCorrect=0; quizStreak=0; quizWrongList=[];
  quizTotal = quizQuestions.length;
  showScreen('quiz'); renderQuiz();
}
function showResult(level, correct, wrong){
  const map = {
    great:{icon:'🎉', title:'太棒了！', sub:'继续加油，N5 在向你招手！'},
    ok:{icon:'👍', title:'不错哦！', sub:'再练几遍就熟了'},
    keep:{icon:'💪', title:'继续坚持！', sub:'错的题我们一起攻下来'}
  };
  const r = map[level];
  $('resIcon').textContent = r.icon;
  $('resTitle').textContent = r.title;
  $('resSub').textContent = r.sub;
  $('resCount').innerHTML = `
    <div class="cc-item"><div class="n good">${correct}</div><div class="l">答对</div></div>
    <div class="cc-item"><div class="n bad">${wrong}</div><div class="l">答错</div></div>
    <div class="cc-item"><div class="n" style="color:var(--yellow)">+${correct*2}</div><div class="l">XP</div></div>`;
  showScreen('result');
}

      {m:'jp2cn', n:'看日语选中文', d:'见到日语，反应中文', icon:'🇯🇵'},
      {m:'listen', n:'听力选词', d:'听发音选词', icon:'👂'},
      {m:'mixed', n:'综合混练', d:'三种题型随机', icon:'🎲'},
      {m:'match', n:'配对连线', d:'日语 ↔ 中文配对', icon:'🔗'}
    ]}
  ];
  let html = '';
  groups.forEach(g=>{
    html += `<div class="practice-group"><div class="pg-title">${g.title}</div><div class="pg-sub">${g.sub}</div><div class="practice-grid">`;
    g.items.forEach(it=>{
      html += `<div class="practice-item" onclick="startQuiz('${it.m}', null, '${it.script||'hira'}')">
        <div class="pi-icon">${it.icon}</div><div class="pi-name">${it.n}</div><div class="pi-desc">${it.d}</div></div>`;
    });
    html += `</div></div>`;
  });
  $('practiceList').innerHTML = html;
}

/* ============ 五十音 ============ */
let kanaTab = 'hira';
function setKanaTab(t){
  kanaTab = t;
  $('tabHira').classList.toggle('active', t==='hira');
  $('tabKata').classList.toggle('active', t==='kata');
  renderKana();
  renderKanaPractice();
}
function renderKana(){
  const rows = kanaTab==='hira' ? [...KANA, ...DAKUON, ...YOON] : [...KATAKANA, ...DAKUON_KATA, ...YOON_KATA];
  let html = '';
  rows.forEach(g=>{
    html += `<div class="kana-row-label">${g.row}</div>`;
    g.kana.forEach(([k,r])=>{
      if(!k){ html += `<div></div>`; return; }
      html += `<div class="kana-cell" onclick="speak('${k}')"><div class="k">${k}</div><div class="r">${r}</div></div>`;
    });
  });
  $('kanaTable').innerHTML = html;
}
function renderKanaPractice(){
  const isKata = kanaTab==='kata';
  const s = isKata ? 'kata' : 'hira';
  const nm = isKata ? '片假名' : '平假名';
  const k = isKata ? 'ア' : 'あ';
  $('kanaPractice').innerHTML = `
    <div class="practice-grid">
      <div class="practice-item" onclick="startKanaFlash('${s}')"><div class="pi-icon">🃏</div><div class="pi-name">闪卡速记</div><div class="pi-desc">${nm}翻卡记读音</div></div>
      <div class="practice-item" onclick="startQuiz('kanaMixed', null, '${s}')"><div class="pi-icon">🎯</div><div class="pi-name">综合测试</div><div class="pi-desc">三种题型随机 10 题</div></div>
      <div class="practice-item" onclick="startMatchQuiz(null, '${s}')"><div class="pi-icon">🔗</div><div class="pi-name">配对连线</div><div class="pi-desc">假名 ↔ 罗马音</div></div>
      <div class="practice-item" onclick="startQuiz('kana2rom', null, '${s}')"><div class="pi-icon">${k}</div><div class="pi-name">看假名选读音</div><div class="pi-desc">${k} → a？</div></div>
      <div class="practice-item" onclick="startQuiz('rom2kana', null, '${s}')"><div class="pi-icon">a</div><div class="pi-name">看读音选假名</div><div class="pi-desc">a → ${k}？</div></div>
      <div class="practice-item" onclick="startQuiz('kanaListen', null, '${s}')"><div class="pi-icon">🔊</div><div class="pi-name">听音辨假名</div><div class="pi-desc">听发音选假名</div></div>
    </div>`;
}
function showKana(){ showScreen('kana'); }

/* ============ 词库（多维分类） ============ */
const DIM_LABEL = {cat:'主题', pos:'词性', script:'假名', source:'来源', mastery:'掌握度'};
const ADV_WORDS = ['はい','いいえ','とても','もう','まだ','よく','すこし'];
const QW_WORDS = ['だれ','いつ','どこ','どうして','どう','いくら','いくつ','どれ','どんな'];
let wordDim = 'cat';
let wGroups = [];

function posOf(w){
  if(w.cat==='动词') return '动词';
  if(w.cat==='形容词') return '形容词';
  if(w.cat==='人称代词') return '代词';
  if(w.cat==='副词疑问'){
    if(ADV_WORDS.includes(w.jp)) return '副词';
    if(QW_WORDS.includes(w.jp)) return '疑问词';
    return '指示词（こそあど）';
  }
  return '名词';
}
function scriptOf(w){
  const hasKata = /[ァ-ヶ]/.test(w.jp);
  const hasHira = /[ぁ-ん]/.test(w.jp);
  if(hasKata && hasHira) return '混合';
  return hasKata ? '片假名（外来语）' : '平假名';
}
function groupWords(dim){
  const groups = {};
  WORDS.forEach(w=>{
    let key;
    if(dim==='cat') key = w.cat;
    else if(dim==='pos') key = posOf(w);
    else if(dim==='script') key = scriptOf(w);
    else if(dim==='source') key = w.src==='duo' ? '📱 老朱 Duolingo 输入' : '📚 宸宸 N5 补充';
    else key = masteryOf(w.jp)==='mastered' ? '🟢 已掌握' : (masteryOf(w.jp)==='learning' ? '🟡 学习中' : '⚪ 未学');
    (groups[key] = groups[key] || []).push(w);
  });
  return groups;
}
function setWordDim(d){
  wordDim = d;
  ['cat','pos','script','source','mastery'].forEach(x=>{
    const el = $('dimTab'+x[0].toUpperCase()+x.slice(1));
    if(el) el.classList.toggle('active', x===d);
  });
  renderWordLibrary();
}
function renderWordLibrary(){
  const g = groupWords(wordDim);
  wGroups = Object.values(g);
  const keys = Object.keys(g);
  let html = '';
  keys.forEach((key, gi)=>{
    const list = g[key];
    html += `<div class="wg">
      <div class="wg-head" onclick="toggleWg(${gi})">
        <span>${key}</span>
        <span class="wg-count">${list.length} 词</span>
        <button class="btn blue small" style="padding:5px 10px;font-size:12px" onclick="event.stopPropagation();practiceGroup(${gi})">▶ 练这组</button>
      </div>
      <div class="wg-body" id="wgBody${gi}">`;
    list.forEach(w=>{
      const dot = {new:'dot-new',learning:'dot-learning',mastered:'dot-mastered'}[masteryOf(w.jp)];
      html += `<div class="word-item" onclick="speak('${w.jp}')">
        <span class="master-dot ${dot}"></span>
        <span class="jp">${w.jp}</span>
        <span class="cn">${w.cn} · ${w.rom}</span>
        <span style="font-size:16px">🔊</span></div>`;
    });
    html += `</div></div>`;
  });
  $('wordList').innerHTML = html;
}
function toggleWg(i){
  const el = $('wgBody'+i);
  if(el) el.classList.toggle('hidden');
}
function practiceGroup(gi){
  const words = wGroups[gi];
  if(!words || !words.length){ toast('这组还没有词'); return; }
  quizMode = 'mixed';
  const picked = words.length>12 ? sample(words, 12) : words;
  quizQuestions = picked.map(w=>makeQuestion(w, picked, WORDS));
  quizIdx = 0; quizCorrect = 0; quizStreak = 0; quizWrongList = [];
  quizTotal = quizQuestions.length;
  showScreen('quiz');
  renderQuiz();
}
function showWordList(){
  showScreen('words');
  $('wordCount').innerHTML = `共 ${WORDS.length} 个单词 · 按${DIM_LABEL[wordDim]}分组 · 点词听发音 · 组标题可折叠`;
  renderWordLibrary();
}
function showProgress(){
  showScreen('words');
  const mastered = WORDS.filter(w=>masteryOf(w.jp)==='mastered').length;
  const learning = WORDS.filter(w=>masteryOf(w.jp)==='learning').length;
  const fresh = WORDS.length-mastered-learning;
  const acc = state.totalAnswered ? Math.round(state.correctAnswered/state.totalAnswered*100) : 0;
  $('wordCount').innerHTML = `
    <div class="stat-row">
      <div class="stat"><div class="num">${state.streak}</div><div class="l">🔥 连续天数</div></div>
      <div class="stat"><div class="num">${state.xp}</div><div class="l">⭐ 总 XP</div></div>
      <div class="stat"><div class="num">${acc}%</div><div class="l">正确率</div></div>
    </div>
    <div style="font-size:13px;color:var(--sub)">词库掌握度</div>
    <div class="progress-bar"><div class="fill" style="width:${(mastered/WORDS.length*100).toFixed(0)}%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--sub)">
      <span>🟢 已掌握 ${mastered}</span><span>🟡 学习中 ${learning}</span><span>⚪ 未学 ${fresh}</span>
    </div>
    <div style="margin-top:10px;font-size:12px;color:#bbb">数据保存在本浏览器，清缓存会丢失 · 下方按掌握度分组</div>`;
  setWordDim('mastery');
}

/* ============ 初始化 ============ */
renderKana();
renderToday();
ensureStreak();
